name: Bug
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: version
    attributes:
      label: Secretarybird version
      description: "`secbird --version`, or hover the tray icon"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: dropdown
    id: synapse
    attributes:
      label: Is Razer Synapse installed?
      options: ["No", "Yes, but closed", "Yes, and running", "Not sure"]
  - type: textarea
    id: log
    attributes:
      label: Last lines of secbird.log
      description: 'In %APPDATA%\Secretarybird\secbird.log (tray menu: Open settings folder)'
      render: text
