name: Device report
description: Tell us how Secretarybird works with your Razer device (working or not)
labels: [device]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Reports like this are how devices get marked as verified and new features
        (like Blade fan and power controls) get built.

        **Easiest:** right-click the Secretarybird tray icon → **Make a device report…**. It copies
        the report and opens this page; paste it into the report box below.

        The report only sends read commands to your devices and shortens serial numbers.
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. BlackWidow V4 Pro, wired
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Does it work?
      options:
        - Everything I tried works
        - Some things work
        - Not detected or nothing works
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What did you try, and what happened?
      placeholder: Lighting zones, brightness, DPI, polling rate, battery...
  - type: textarea
    id: report
    attributes:
      label: Output of `secbird report`
      description: 'From the tray menu (Make a device report…), or run `secbird report` in a terminal. The installed copy is in %LOCALAPPDATA%\Programs\Secretarybird.'
      render: text
    validations:
      required: true
  - type: textarea
    id: laptop
    attributes:
      label: Razer Blade laptops only
      description: Exact model and year (e.g. Blade 16 2024, RTX 4080), and which fan and power modes Synapse offers on it (Balanced, Silent, Performance, Custom fan speed, battery charge limit, GPU mode...). This tells us what to build.
  - type: input
    id: version
    attributes:
      label: Secretarybird version
      description: "`secbird --version`, or hover the tray icon"
      placeholder: "0.1.0"
