<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Secretarybird Banner</title>
<style>
  html, body { margin: 0; }
  body { width: 1280px; height: 400px; background: radial-gradient(900px 420px at 30% 50%, #1a1412 0%, #0c0c0e 60%); display: flex; align-items: center; justify-content: center; gap: 44px; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: #f2f2f4; overflow: hidden; }
  img { width: 168px; height: 168px; border-radius: 38px; box-shadow: 0 0 0 1px #ffffff14, 0 24px 60px #0008; }
  h1 { margin: 0; font-size: 92px; font-weight: 700; letter-spacing: -2.5px; line-height: 1; }
  p { margin: 14px 0 0 4px; font-size: 34px; font-weight: 400; color: #9a9ca3; letter-spacing: -.3px; }
  p b { color: #f26b21; font-weight: 600; }
  @media (prefers-color-scheme: light) {
    body { background: radial-gradient(900px 420px at 30% 50%, #fff4ec 0%, #ffffff 60%); color: #16161a; }
    img { box-shadow: 0 0 0 1px #0000000f, 0 24px 50px #0002; }
    p { color: #6b6b76; }
    p b { color: #e05a12; }
  }
</style>
</head>
<body>
  <img src="../assets/logo.png" alt="">
  <div>
    <h1>Secretarybird</h1>
    <p>Your Razer gear, <b>minus the bloat.</b></p>
  </div>
</body>
</html>
