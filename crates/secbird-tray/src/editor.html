<style>
  /* Themes. Each sets every token; the accent means live, selected, changed or focused, and
     the value colour carries numbers. Auto follows Windows: Bridge when dark, Light when light. */
  :root, :root[data-theme="bridge"] { --bg: #050505; --bar: #0d0d0e; --panel: #131314; --raise: #1b1b1d; --line: #242426; --line-strong: #4a4440; --text: #f4efe9; --muted: #b8aea3; --faint: #9c9287; --value: #ffb85d; --accent: #ff5412; --accent-text: #ff7a45; --lit: #ff541224; --lit-edge: #ff5412; --toast: #1b1b1d; --zone-off: #242426; --body-fill: #131314; --body-stroke: #3a3632; --button-fill: #1b1b1d; --key-fill: #1b1b1d; --key-stroke: #34312e; --key-text: #f4efe999; --warn-line: #ffb85d55; --warn-bg: #ffb85d14; --warn-text: #ffb85d; --err: #ff4a5a; --err-text: #ffb4bb; --shadow: 0 12px 32px -14px #000000e6; color-scheme: dark; }
  :root[data-theme="roast"] { --bg: #150d05; --bar: #1e1007; --panel: #201002; --raise: #2b1909; --line: #3a2916; --line-strong: #64492b; --text: #f5e0d3; --muted: #b58754; --faint: #ad8150; --value: #e2aa6b; --accent: #c35724; --accent-text: #f57032; --lit: #c3572426; --lit-edge: #c35724; --toast: #2b1909; --zone-off: #3a2916; --body-fill: #201002; --body-stroke: #4a2b09; --button-fill: #2b1909; --key-fill: #2b1909; --key-stroke: #4a2b09; --key-text: #f5e0d399; --warn-line: #f8ac6055; --warn-bg: #f8ac6014; --warn-text: #f8ac60; --err: #ff5a4e; --err-text: #ffb4a8; --shadow: 0 12px 32px -14px #000000d9; color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root:not([data-theme]) { --bg: #f4f4f7; --bar: #ffffff; --panel: #ffffff; --raise: #f0f0f4; --line: #e1e1e8; --line-strong: #c3c3cc; --text: #18181d; --muted: #5f5f6b; --faint: #6c6c78; --value: #18181d; --accent: #c35724; --accent-text: #9a3f14; --lit: #c357241a; --lit-edge: #c35724; --toast: #ffffff; --zone-off: #d9d9df; --body-fill: #f1f1f4; --body-stroke: #c4c4cc; --button-fill: #e4e4ea; --key-fill: #ececf0; --key-stroke: #cfcfd7; --key-text: #00000099; --warn-line: #c9a20055; --warn-bg: #fff7d6; --warn-text: #6b5200; --err: #d70015; --err-text: #b3261e; --shadow: 0 10px 30px -14px #1b1b3040; color-scheme: light; } }
  :root[data-theme="classic"] { --bg: #0d0d10; --bar: #111115; --panel: #15151a; --raise: #1b1b21; --line: #25252d; --line-strong: #3a3a44; --text: #ececf1; --muted: #9a9aa6; --faint: #858591; --value: #ececf1; --accent: #e8782a; --accent-text: #f2a066; --lit: #e8782a1f; --lit-edge: #e8782a; --toast: #222229; --zone-off: #2a2a31; --body-fill: #141418; --body-stroke: #2b2b33; --button-fill: #1d1d23; --key-fill: #1b1b21; --key-stroke: #2e2e37; --key-text: #ffffff99; --warn-line: #ffd60a55; --warn-bg: #ffd60a12; --warn-text: #ffe58a; --err: #ff453a; --err-text: #ffb4ae; --shadow: 0 10px 30px -12px #000000cc; color-scheme: dark; }
  :root[data-theme="light"] { --bg: #f4f4f7; --bar: #ffffff; --panel: #ffffff; --raise: #f0f0f4; --line: #e1e1e8; --line-strong: #c3c3cc; --text: #18181d; --muted: #5f5f6b; --faint: #6c6c78; --value: #18181d; --accent: #c35724; --accent-text: #9a3f14; --lit: #c357241a; --lit-edge: #c35724; --toast: #ffffff; --zone-off: #d9d9df; --body-fill: #f1f1f4; --body-stroke: #c4c4cc; --button-fill: #e4e4ea; --key-fill: #ececf0; --key-stroke: #cfcfd7; --key-text: #00000099; --warn-line: #c9a20055; --warn-bg: #fff7d6; --warn-text: #6b5200; --err: #d70015; --err-text: #b3261e; --shadow: 0 10px 30px -14px #1b1b3040; color-scheme: light; }
  :root[data-theme="workshop"] { --bg: #ede7dc; --bar: #e0d7c7; --panel: #f7f3ec; --raise: #e8e0d2; --line: #d6ccb9; --line-strong: #b3a68d; --text: #3d362a; --muted: #5c5141; --faint: #62564a; --value: #8a3f1b; --accent: #d0643e; --accent-text: #913c1a; --lit: #e7a26542; --lit-edge: #d0643e; --toast: #f7f3ec; --zone-off: #d6ccb9; --body-fill: #e8e0d2; --body-stroke: #b3a68d; --button-fill: #e0d7c7; --key-fill: #e8e0d2; --key-stroke: #cbbfa8; --key-text: #3d362a99; --warn-line: #a6672255; --warn-bg: #e7a2652a; --warn-text: #5a3412; --err: #c2181a; --err-text: #a3171a; --shadow: 0 12px 32px -16px #3d362a40; color-scheme: light; }
  :root[data-theme="neon"] { --bg: #160520; --bar: #1e0829; --panel: #250a33; --raise: #2f0d40; --line: #45185a; --line-strong: #6b2a85; --text: #f1e3d0; --muted: #c99ec6; --faint: #ad80ab; --value: #fbb550; --accent: #dd3290; --accent-text: #f26cb4; --lit: #dd32902e; --lit-edge: #dd3290; --toast: #2f0d40; --zone-off: #45185a; --body-fill: #250a33; --body-stroke: #5a1f73; --button-fill: #2f0d40; --key-fill: #2f0d40; --key-stroke: #5a1f73; --key-text: #f1e3d099; --warn-line: #fbb55055; --warn-bg: #fbb55014; --warn-text: #fbb550; --err: #ff5a6e; --err-text: #ffb4c0; --shadow: 0 12px 32px -14px #000000d9; color-scheme: dark; }
  /* Bridge goes bold: the live profile, current section and selected tile are solid red-orange with black text. */
  :root[data-theme="bridge"] .tile[aria-pressed=true] { background: #ff5412; border-color: #ff5412; }
  :root[data-theme="bridge"] .tile[aria-pressed=true] .tl, :root[data-theme="bridge"] .tile[aria-pressed=true] .tv, :root[data-theme="bridge"] .tile[aria-pressed=true] .tv small, :root[data-theme="bridge"] .tile[aria-pressed=true] .tv .unset,
  :root[data-theme="bridge"] .tile[aria-pressed=true] .big, :root[data-theme="bridge"] .tile.changed[aria-pressed=true] .tl::after { color: #0a0a0b; }
  :root[data-theme="bridge"] .pbtn[aria-current=true], :root[data-theme="bridge"] .pbtn[aria-current=true]:hover { background: #ff5412; color: #0a0a0b; }
  :root[data-theme="bridge"] .pbtn[aria-current=true] .g { color: #0a0a0b; }
  :root[data-theme="bridge"] .uline { display: none; }
  :root[data-theme="bridge"] .sec[aria-current=true] { background: #ff5412; border-color: #ff5412; }
  :root[data-theme="bridge"] .sec[aria-current=true] b, :root[data-theme="bridge"] .sec[aria-current=true] span { color: #0a0a0b; }
  :root[data-theme="bridge"] .seg button[aria-pressed=true] { background: #ff5412; color: #0a0a0b; box-shadow: none; }
  :root[data-theme="bridge"] .tab[aria-selected=true] { border-color: #ff5412; }
  @media (prefers-color-scheme: dark) {
  :root:not([data-theme]) .tile[aria-pressed=true] { background: #ff5412; border-color: #ff5412; }
  :root:not([data-theme]) .tile[aria-pressed=true] .tl, :root:not([data-theme]) .tile[aria-pressed=true] .tv, :root:not([data-theme]) .tile[aria-pressed=true] .tv small, :root:not([data-theme]) .tile[aria-pressed=true] .tv .unset,
  :root:not([data-theme]) .tile[aria-pressed=true] .big, :root:not([data-theme]) .tile.changed[aria-pressed=true] .tl::after { color: #0a0a0b; }
  :root:not([data-theme]) .pbtn[aria-current=true], :root:not([data-theme]) .pbtn[aria-current=true]:hover { background: #ff5412; color: #0a0a0b; }
  :root:not([data-theme]) .pbtn[aria-current=true] .g { color: #0a0a0b; }
  :root:not([data-theme]) .uline { display: none; }
  :root:not([data-theme]) .sec[aria-current=true] { background: #ff5412; border-color: #ff5412; }
  :root:not([data-theme]) .sec[aria-current=true] b, :root:not([data-theme]) .sec[aria-current=true] span { color: #0a0a0b; }
  :root:not([data-theme]) .seg button[aria-pressed=true] { background: #ff5412; color: #0a0a0b; box-shadow: none; }
  :root:not([data-theme]) .tab[aria-selected=true] { border-color: #ff5412; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--lit); color: var(--text); }
  input, textarea { caret-color: var(--accent); }
  html { scrollbar-color: var(--line-strong) transparent; accent-color: var(--accent); }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
  .ico { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; flex: none; }

  /* Top bar: brand, devices, actions for every device. */
  header.top { display: flex; align-items: center; gap: 14px; padding: 0 20px; height: 52px; flex: none; background: var(--bar); border-bottom: 1px solid var(--line); }
  .brand { background: none; border: 0; padding: 4px 6px 4px 0; cursor: pointer; font-weight: 650; display: flex; align-items: center; gap: 10px; flex: none; }
  .brand img { width: 24px; height: 24px; border-radius: 7px; }
  .tabs { display: flex; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; flex: 1; }
  /* A row that can hold more than fits (devices, profiles): arrows and a fade show there is more. */
  .scrollrow { position: relative; display: flex; align-items: center; min-width: 0; flex: 1; }
  .scrollrow > nav { scroll-behavior: smooth; }
  .scrollrow.more-r > nav { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent); }
  .scrollrow.more-l > nav { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(to left, #000 calc(100% - 48px), transparent); }
  .scrollrow.more-l.more-r > nav { -webkit-mask-image: linear-gradient(to right, transparent, #000 48px, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(to right, transparent, #000 48px, #000 calc(100% - 48px), transparent); }
  .arrow { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .arrow:hover { color: var(--text); border-color: var(--line-strong); }
  .arrow .ico { width: 13px; height: 13px; }
  .arrow.l { margin-right: 4px; }
  .arrow.r { margin-left: 4px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { white-space: nowrap; flex: none; background: none; border: 1px solid transparent; border-radius: 999px; padding: 5px 12px; color: var(--muted); cursor: pointer; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected=true] { border-color: var(--line); color: var(--text); background: var(--panel); }
  .actions { display: flex; align-items: center; gap: 8px; flex: none; }
  .ghost { white-space: nowrap; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .ghost:hover { color: var(--text); border-color: var(--line-strong); }
  .ghost:disabled { opacity: .45; cursor: not-allowed; }
  .ghost[aria-pressed=true] { color: var(--text); border-color: var(--accent); }
  .sync { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding-left: 9px; }
  .sync:hover { border-color: var(--line-strong); }
  .sync button { background: none; border: 0; padding: 6px 12px 6px 8px; cursor: pointer; color: var(--muted); white-space: nowrap; }
  .sync button:hover { color: var(--text); }
  .mini { position: relative; width: 18px; height: 18px; border-radius: 5px; overflow: hidden; border: 1px solid #00000066; flex: none; cursor: pointer; }
  .mini input { position: absolute; inset: -8px; width: 34px; height: 34px; border: 0; padding: 0; cursor: pointer; }
  .themepick { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding-left: 9px; }
  .themepick:hover { border-color: var(--line-strong); color: var(--text); }
  .themepick svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; flex: none; }
  .themepick select { border: 0; background-color: transparent; padding: 6px 28px 6px 2px; color: inherit; }
  .banner { margin: 0; padding: 8px 20px; border-bottom: 1px solid var(--warn-line); background: var(--warn-bg); color: var(--warn-text); font-size: 13px; flex: none; }
  .banner code { font-family: ui-monospace, Consolas, monospace; }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .empty { margin: auto; text-align: center; color: var(--muted); padding: 40px 20px; }

  /* Device bar: what this is, its live look, and which profile is live. */
  .devbar { display: flex; align-items: center; gap: 16px; padding: 10px 20px; flex: none; background: var(--bar); border-bottom: 1px solid var(--line); }
  .devbar svg#preview { width: 30px; height: 45px; flex: none; }
  .who { min-width: 0; flex: 0 1 auto; max-width: 34%; }
  .who h1 { margin: 0; font-size: 16px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--muted); font-size: 12.5px; margin: 1px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zone-shape { transition: fill .15s, stroke .15s, opacity .15s; cursor: pointer; }
  .m-body { fill: var(--body-fill); stroke: var(--body-stroke); }
  .m-line { stroke: var(--body-stroke); }

  /* Profile switcher: the live profile carries the ember underline, which slides when it changes. */
  .profiles { position: relative; display: flex; align-items: center; gap: 2px; min-width: 0; flex: 1; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  #profilesRow { flex: 1; }
  .profiles::-webkit-scrollbar { display: none; }
  .pbtn { position: relative; flex: none; white-space: nowrap; background: none; border: 0; border-radius: 8px; padding: 7px 12px 9px; color: var(--muted); cursor: pointer; font-weight: 600; }
  .pbtn:hover { color: var(--text); background: var(--raise); }
  .pbtn[aria-current=true] { color: var(--text); }
  .pbtn .g { font-weight: 400; color: var(--faint); font-size: 12px; margin-left: 6px; }
  .uline { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; border-radius: 3px; background: var(--accent); pointer-events: none;
    transition: transform .35s cubic-bezier(.16, 1, .3, 1), width .35s cubic-bezier(.16, 1, .3, 1); }
  .padd { flex: none; background: none; border: 1px dashed var(--line-strong); border-radius: 8px; padding: 6px 11px; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; margin-left: 6px; }
  .padd:hover { color: var(--text); border-color: var(--muted); }
  .newform { display: flex; align-items: center; gap: 6px; flex: none; margin-left: 6px; }
  .newform input { width: 170px; }
  .devright { display: flex; align-items: center; gap: 8px; flex: none; }

  /* Workbench: sections, tiles, edit panel. Fills the window; nothing below the fold. */
  .work { flex: 1; min-height: 0; display: grid; grid-template-columns: 196px minmax(0, 1fr) 384px; }
  .work.wide { grid-template-columns: 196px minmax(0, 1fr); }
  .work.wide .tiles { display: none; }
  .rail { background: var(--bar); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
  .sec { display: grid; gap: 1px; text-align: left; background: none; border: 1px solid transparent; border-radius: 9px; padding: 8px 12px; cursor: pointer; color: var(--muted); }
  .sec b { font-weight: 600; color: var(--text); font-size: 14px; }
  .sec span { font-size: 12px; display: flex; align-items: center; gap: 5px; min-height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sec:hover { background: var(--raise); }
  .sec[aria-current=true] { background: var(--panel); border-color: var(--accent); }
  .dot { width: 11px; height: 11px; border-radius: 50%; border: 1px solid #00000066; flex: none; }
  .dot.off { background: none; border: 1.5px dashed var(--line-strong); }

  .tiles { overflow-y: auto; padding: 16px 20px 20px; min-width: 0; }
  .sechead { display: flex; align-items: center; gap: 14px; margin: 0 0 12px; min-height: 30px; flex-wrap: wrap; }
  .sechead h2 { margin: 0; font-size: 17px; font-weight: 650; }
  .sechead .tools { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 8px; }
  .tile { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px 10px; min-height: 62px; cursor: pointer;
    display: flex; flex-direction: column; gap: 3px; min-width: 0; transition: border-color .12s, background-color .12s; }
  .tile:hover { border-color: var(--line-strong); }
  .tile[aria-pressed=true] { border-color: var(--lit-edge); background: var(--lit); }
  .tile:disabled { cursor: progress; }
  .tl { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tv { display: block; min-height: 22px; line-height: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tv .sw { vertical-align: -3px; margin-right: 7px; }
  .tile.changed .tl::after { content: " · changed"; color: var(--accent-text); }
  .tile.changed .tv { color: var(--accent-text); }
  .tv .unset { color: var(--faint); font-weight: 400; }
  .tv small { color: var(--muted); font-weight: 400; }
  .big { font-size: 17px; font-weight: 650; color: var(--value); }
  .sw { width: 16px; height: 16px; border-radius: 5px; border: 1px solid #00000066; flex: none; display: inline-block; }
  .sw.off { background: none; border: 1.5px dashed var(--line-strong); }
  .subhead { margin: 18px 0 8px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  /* Naga side grid: a keypad, laid out like the mouse. */
  .keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 168px)); gap: 6px; }
  .keypad .tile { min-height: 52px; padding: 6px 10px 7px; }
  .keypad .tl { color: var(--value); font-weight: 650; font-size: 13px; }
  .skel { height: 62px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .uline { transition: none; } .skel { animation: none; } }

  .panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .phead { display: flex; align-items: center; gap: 10px; padding: 14px 18px 12px; border-bottom: 1px solid var(--line); flex: none; }
  .phead h2 { margin: 0; font-size: 15px; font-weight: 650; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xbtn { background: none; border: 1px solid transparent; border-radius: 8px; width: 30px; height: 30px; display: grid; place-items: center; cursor: pointer; color: var(--muted); flex: none; }
  .xbtn:hover { color: var(--text); border-color: var(--line); }
  .xbtn .ico { width: 13px; height: 13px; }
  .pbody { overflow-y: auto; padding: 16px 18px 20px; flex: 1; min-height: 0; }
  .edbox { display: flex; flex-direction: column; gap: 20px; }
  .work.wide .edbox { flex-direction: row; flex-wrap: wrap; gap: 18px 28px; }
  .edbox h3 { margin: 0 0 9px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .edbox .note { margin: 0; color: var(--muted); font-size: 12.5px; max-width: 60ch; }
  .edgroup { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .lead { font-size: 15px; font-weight: 650; margin: 0 0 4px; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 13px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; }
  select, input[type=text], input[type=number], textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
  textarea { width: 100%; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  select:hover, input:hover, textarea:hover { border-color: var(--line-strong); }
  select { appearance: none; padding-right: 30px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
  input[type=radio], input[type=checkbox]:not(.switch) { appearance: none; width: 16px; height: 16px; margin: 0; flex: none; cursor: pointer;
    border: 1.5px solid var(--line-strong); background: var(--bg); }
  input[type=radio] { border-radius: 50%; }
  input[type=checkbox]:not(.switch) { border-radius: 4px; }

const icon = name => `<svg class="ico" viewBox="0 0 16 16" aria-hidden="true">${ICONS[name]}</svg>`;
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const label = name => NAMES[name] || name.charAt(0).toUpperCase() + name.slice(1);
const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');
const hz = v => v + ' Hz';
const devLabel = d => devices.filter(x => x.pid === d.pid).length > 1 && d.serial ? d.name + ' (' + d.serial.slice(-4) + ')' : d.name;

// A device's profiles: the active one is `dev.profile`, the rest come from `profilesData`.
function adopt(d) {
  Object.assign(dev, d);
  dev.profilesData = dev.profilesData || {};
  dev.profile = dev.profile || {};

}
const prof = name => (name === dev.active ? dev.profile : (dev.profilesData && dev.profilesData[name])) || {};
const zoneOf = (p, name) => (p.lighting && p.lighting[name]) || {};
const keyCount = () => dev.matrix.rows * dev.matrix.cols;

// ---------- Rendering ----------

function render() {
  const has = devices.length > 0;
  if (!has) showAll = unsupported.length > 0;
  $('empty').hidden = has || unsupported.length > 0;
  $('overview').hidden = !showAll;
  const onDevice = has && !showAll;
  $('devbar').hidden = !onDevice;
  $('work').hidden = !onDevice || view === 'compare';
  $('compare').hidden = !onDevice || view !== 'compare';
  $('synBanner').hidden = !synapse.length;
  $('sync').hidden = !devices.some(d => d.leds.length);
  if (!syncPicked && dev) { // until a sync color is picked, offer the color on screen
    const lit = dev.leds.map(l => zoneOf(dev.profile || {}, l.name)).find(z => z.color && !z.off);
    if (lit) $('syncColor').value = '#' + lit.color.toLowerCase();
  }
  $('tabs').innerHTML = '';
  const tab = (text, selected, onclick) => $('tabs').append(el('button', { className: 'tab', textContent: text, onclick, ariaSelected: selected }));
  if (devices.length || unsupported.length) {
    tab('All devices', !!showAll, () => { showAll = true; sel = null; render(); });
    devices.forEach(d => tab(devLabel(d), !showAll && d.id === dev.id, () => openDevice(d)));
  }
  requestAnimationFrame(() => { bringIntoView($('tabs'), $('tabs').querySelector('[aria-selected=true]')); updateTabsRow(); });
  if (showAll) return renderOverview();
  if (!has) return;
  renderDevbar();
  if (view === 'compare') renderCompare(); else renderWork();
}

function openDevice(d) {
  dev = d; sel = null; showAll = false;
  section = null; // resolved (last used, else first) when the workbench draws
  render();
}

// Per-browser conveniences: which section each device opens on.
function remembered(key) { try { return localStorage.getItem('secbird-' + key); } catch { return null; } }
function remember(key, value) { try { localStorage.setItem('secbird-' + key, value); } catch { } }

function renderDevbar() {
  $('name').textContent = devLabel(dev);
  $('meta').textContent = [KINDS[dev.kind] || 'Device', dev.battery != null && dev.battery + '% battery',
    !dev.known && 'not in the device database'].filter(Boolean).join(' · ');
  paintPreview();
  renderProfiles();
  $('compareBtn').ariaPressed = view === 'compare';
  $('compareBtn').hidden = dev.profiles.length < 2 && view !== 'compare';
}

// Profile switcher: one click makes a profile live. The ember underline slides to it.
function renderProfiles(adding) {
  const box = $('profiles');
  box.innerHTML = '';
  dev.profiles.forEach(n => {
    const apps = (prof(n).apps || []).length;
    const b = el('button', { className: 'pbtn', ariaCurrent: n === dev.active, title: n === dev.active ? n + ' is live' : 'Make ' + n + ' live',
      onclick: () => { if (n !== dev.active) activate(n); } }, n, apps ? el('span', { className: 'g num', textContent: apps === 1 ? '1 game' : apps + ' games' }) : null);
    b.dataset.p = n;
    box.append(b);
  });
  if (adding) {
    const input = el('input', { type: 'text', placeholder: 'Name, e.g. Valorant', maxLength: 32, ariaLabel: 'New profile name' });
    const form = el('form', { className: 'newform', onsubmit: e => { e.preventDefault(); if (input.value.trim()) createProfile(input.value.trim()); } },
      input, el('button', { className: 'ghost', textContent: 'Create', type: 'submit' }),
      el('button', { className: 'ghost', textContent: 'Cancel', type: 'button', onclick: () => renderProfiles() }));
    input.onkeydown = e => { if (e.key === 'Escape') { e.stopPropagation(); renderProfiles(); } };
    box.append(form); input.focus();
  } else {
    box.append(el('button', { className: 'padd', innerHTML: icon('plus') + 'New', title: 'New profile, a copy of ' + dev.active, onclick: () => renderProfiles(true) }));
  }
  box.append(el('span', { className: 'uline', id: 'uline' }));
  requestAnimationFrame(placeUnderline);
}
function placeUnderline() {
  const b = $('profiles').querySelector('.pbtn[aria-current=true]'), u = $('uline');
  if (!b || !u) return;
  u.style.width = (b.offsetWidth - 20) + 'px';
  u.style.transform = `translateX(${b.offsetLeft + 10}px)`;
  bringIntoView($('profiles'), b);
  updateProfilesRow();
}
window.addEventListener('resize', () => requestAnimationFrame(() => { placeUnderline(); placeBand(); }));

function paintPreview() {
  const leds = dev.leds.map(l => l.name);
  $('preview').style.display = dev.kind === 'mouse' && leds.some(n => ['scroll', 'logo', 'underglow'].includes(n)) ? '' : 'none';
  ['scroll', 'logo', 'underglow'].forEach(n => {
    const e = $('z-' + n), z = zoneOf(dev.profile, n), lit = leds.includes(n) && !z.off && z.color;
    const color = lit ? '#' + z.color : 'var(--zone-off)';
    e.style.opacity = lit ? 0.35 + 0.65 * ((z.brightness ?? 100) / 100) : 1;
    if (e.getAttribute('fill') === 'none') e.style.stroke = color; else e.style.fill = color;
    e.onclick = leds.includes(n) ? () => toggleEditor('zone:' + n, dev.active) : null;
  });
}

// Sections of this device, each with its tiles. Only what the device has.
function sections() {
  const s = [];
  const light = dev.leds.map(l => ({ key: 'zone:' + l.name, label: label(l.name) }));
  if (dev.matrix) light.push({ key: 'keys', label: 'Per-key colors' });
  if (light.length) s.push({ id: 'light', name: 'Lighting', rows: light, tools: dev.leds.length > 1 ? 'allzones' : null });
  const sens = [];
  if (dev.dpi) sens.push({ key: 'dpi', label: 'DPI' });
  if (dev.stages) sens.push({ key: 'stages', label: 'DPI stages' });
  if (dev.polling) sens.push({ key: 'polling', label: 'Polling rate' });
  if (sens.length) s.push({ id: 'sens', name: 'Sensitivity', rows: sens });
  if (dev.kind === 'mouse') {
    const list = btnData[dev.id];
    s.push({ id: 'buttons', name: 'Buttons', tools: 'layer', loading: !list,
      rows: (list || []).filter(b => b[btnLayer] != null).map(b => ({ key: 'btn:' + b.name, label: b.label, name: b.name })) });
  }
  if (dev.macros) s.push({ id: 'macros', name: 'Macros', rows: [{ key: 'macros', label: 'Macros on the device' }] });
  if (dev.sleep) s.push({ id: 'power', name: 'Power', rows: [{ key: 'sleep', label: 'Sleep when idle' }] });
  s.push({ id: 'profile', name: 'Profile', rows: [{ key: 'apps', label: 'Switches with' }] });
  s.push({ id: 'device', name: 'Device', rows: [{ key: 'device', label: 'About this device' }] });
  return s;
}
const sectionOf = key => (sections().find(s => s.rows.some(r => r.key === key))
  || (key.startsWith('btn:') && { id: 'buttons' }) || {}).id;

// One line under each section name: what it holds right now, read from memory only.
function railSummary(s) {
  const p = dev.profile;
  if (s.id === 'light') {
    if (p.keys && p.keys.length && dev.matrix) return 'Per-key colors';
    const box = el('span');
    dev.leds.forEach(l => { const z = zoneOf(p, l.name); const d = el('i', { className: 'dot' + (z.off || !z.color ? ' off' : '') });
      if (z.color && !z.off) d.style.background = '#' + z.color; box.append(d); });
    const fx = dev.leds.map(l => zoneOf(p, l.name).effect).find(Boolean);
    const lit = dev.leds.map(l => zoneOf(p, l.name)).filter(z => z.color && !z.off);
    box.append(fx ? effectLabel(fx) : lit.length === 1 ? '#' + lit[0].color : lit.length ? plural(lit.length, 'zone') + ' lit' : 'Off');
    return box;
  }
  if (s.id === 'sens') return [dev.dpi && dev.dpi.x + ' DPI', dev.polling && hz(dev.polling.hz)].filter(Boolean).join(' · ');
  if (s.id === 'buttons') {
    const n = Object.keys(p.buttons || {}).length;
    return n ? plural(n, 'button') + ' changed' : 'As saved in the mouse';
  }
  if (s.id === 'macros') { const m = macroData[dev.id]; return m ? (m.macros.length ? plural(m.macros.length, 'macro') : 'None yet') : 'On the device'; }
  if (s.id === 'power') { const sl = dev.sleep; return sl.auto === false ? 'Never sleeps' : 'Sleeps after ' + sl.minutes + ' min'; }
  if (s.id === 'profile') { const a = p.apps || []; return a.length ? a.join(', ') : 'No games yet'; }
  if (s.id === 'device') return dev.firmware ? 'Firmware ' + dev.firmware : (KINDS[dev.kind] || 'Device');
  return '';
}

function renderRail(secs) {
  const rail = $('rail');
  rail.innerHTML = '';
  secs.forEach(s => {
    const sum = railSummary(s);
    const b = el('button', { className: 'sec', ariaCurrent: s.id === section, onclick: () => showSection(s.id) },
      el('b', { textContent: s.name }), typeof sum === 'string' ? el('span', { textContent: sum }) : sum);
    b.dataset.sec = s.id;
    rail.append(b);
  });
}

function showSection(id) {
  if (section === id) return;
  section = id;
  sel = autoOpen(sections().find(s => s.id === id));
  remember('section:' + dev.pid, id);
  renderWork();
}
// A section with one setting opens straight into its editor: one click less.
const autoOpen = s => (s && !s.loading && s.rows.length === 1 ? s.rows[0].key : null);

// The workbench: rail, tiles of the section, edit panel. `keepPanel` leaves an open editor alone.
function renderWork(keepPanel) {
  const secs = sections();
  let entering = false;
  if (!secs.some(s => s.id === section)) {
    const last = remembered('section:' + dev.pid);
    section = secs.some(s => s.id === last) ? last : secs[0].id;
    entering = true;
  }
  const cur = secs.find(s => s.id === section);
  if (entering && !sel) sel = autoOpen(cur);
  // Slow reads happen only when their section is open, once per device.
  if (section === 'buttons') loadButtons(dev);
  if ((section === 'buttons' || section === 'macros') && dev.macros && macroData[dev.id] === undefined) loadMacros(dev);
  if (sel && sectionOf(sel) !== section) sel = null;
  renderRail(secs);
  renderTiles(cur);
  $('work').classList.toggle('wide', sel === 'keys');
  $('work').classList.toggle('has-sel', !!sel);
  if (!keepPanel || !$('panel').childElementCount) renderPanel(cur);
}

function renderTiles(cur) {
  const t = $('tiles');
  t.innerHTML = '';
  const head = el('div', { className: 'sechead' }, el('h2', { textContent: cur.name }));
  const tools = el('div', { className: 'tools' });
  if (cur.tools === 'layer') {
    if (Object.keys(dev.profile.buttons || {}).length) tools.append(el('button', { className: 'ghost', textContent: 'Restore all',
      title: 'Every changed button back to what the mouse stores', onclick: restoreAllButtons }));
    const seg = el('span', { className: 'seg', role: 'group', ariaLabel: 'Button layer' });
    [['normal', 'Normal'], ['hypershift', 'HyperShift']].forEach(([v, txt]) => seg.append(el('button', {
      textContent: txt, ariaPressed: btnLayer === v, title: v === 'hypershift' ? 'What each button does while a button set to HyperShift is held' : 'What each button does',
      onclick: () => { btnLayer = v; sel = null; renderWork(); } })));
    tools.append(seg);
  } else if (cur.tools === 'allzones') {
    tools.append(el('button', { className: 'link', textContent: 'Same color on all zones',
      onclick: () => { const z = dev.leds.map(l => zoneOf(dev.profile, l.name)).find(z => z.color); if (z) dev.leds.forEach(l => setColor(z.color, l.name)); else toast('Pick a color for one zone first', true); } }));
  }
  head.append(tools);
  t.append(head);
  if (cur.loading) {
    const g = el('div', { className: 'tgrid' });
    for (let i = 0; i < 8; i++) g.append(el('div', { className: 'skel' }));
    t.append(g, el('p', { className: 'hint', textContent: 'Reading the buttons from the mouse…' }));
    return;
  }
  // Side plates (Naga) are drawn as keypads, the way they sit on the mouse.
  const plain = cur.rows.filter(r => !/^btn:(grid|hex)-/.test(r.key));
  const grid = cur.rows.filter(r => /^btn:grid-/.test(r.key));
  const hex = cur.rows.filter(r => /^btn:hex-/.test(r.key));
  const g = el('div', { className: 'tgrid' });
  plain.forEach(r => g.append(tile(r)));
  t.append(g);
  if (grid.length) {
    t.append(el('p', { className: 'subhead', textContent: 'Side grid' }));
    const k = el('div', { className: 'keypad' });
    grid.forEach(r => k.append(tile(r, r.key.slice(9))));
    t.append(k);
  }
  if (hex.length) {
    t.append(el('p', { className: 'subhead', textContent: '6-button side plate' }));
    const k = el('div', { className: 'keypad' });
    hex.forEach(r => k.append(tile(r, r.key.slice(8))));
    t.append(k);
  }
}

function tile(r, short) {
  const [html, changed] = cellView(r.key, dev.active);
  const b = el('button', { className: 'tile' + (changed ? ' changed' : ''), ariaPressed: sel === r.key,
    ariaLabel: r.label + (changed ? ' (changed)' : ''), onclick: () => select(r.key) },
    el('span', { className: 'tl', textContent: short || r.label }), el('span', { className: 'tv', innerHTML: html }));
  b.dataset.row = r.key;
  if (short) b.title = r.label;
  return b;
}

function select(key) {
  sel = sel === key ? null : key;
  renderWork();
  if (sel && matchMedia('(max-width: 820px)').matches) { // keep the tile in sight above the sheet
    const t = document.querySelector(`.tile[data-row="${CSS.escape(sel)}"]`);
    if (t) t.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }
  if (sel) {
    const first = $('panel').querySelector('.pbody button, .pbody input, .pbody select, .pbody textarea');
    if (first && matchMedia('(min-width: 821px)').matches) first.focus({ preventScroll: true });
  }
}

function renderPanel(cur) {
  const p = $('panel');
  p.innerHTML = '';
  const r = sel && cur.rows.find(x => x.key === sel);
  if (!r) {
    p.append(el('div', { className: 'phead' }, el('h2', { textContent: 'Live now: ' + dev.active })),
      el('div', { className: 'pbody' }, liveSummary()));
    return;
  }
  const title = r.label + (r.key.startsWith('btn:') && btnLayer === 'hypershift' ? ' · HyperShift' : '');
  p.append(el('div', { className: 'phead' },
    el('h2', { textContent: title }),
    el('button', { className: 'xbtn', innerHTML: icon('x'), title: 'Close (Esc)', ariaLabel: 'Close', onclick: closePanel })));
  const body = el('div', { className: 'pbody' });
  p.append(body);
  buildEditor(body, r);
}

function closePanel() {
  const was = sel; sel = null; renderWork();
  const t = was && document.querySelector(`.tile[data-row="${CSS.escape(was)}"]`);
  if (t) t.focus({ preventScroll: true });
}

// The panel with nothing selected: what is live, and how saving works.
function liveSummary() {
  const p = dev.profile, apps = p.apps || [];
  const box = el('div', { className: 'edbox' });
  box.append(el('div', { className: 'edgroup' },
    el('p', { className: 'hint', innerHTML: `<b>${esc(dev.active)}</b> is live on this ${esc((KINDS[dev.kind] || 'device').toLowerCase())}.` +
      (apps.length ? ` It also comes up while ${esc(apps.join(', '))} ${apps.length === 1 ? 'is' : 'are'} in front.` : '') }),
    el('p', { className: 'hint', textContent: 'Pick a setting to change it. Changes apply right away and are saved to ' + dev.active + '; there is nothing to save or close.' })));
  if (dev.kind === 'mouse') box.append(el('p', { className: 'note', textContent: 'Button changes go to the mouse’s live memory; Restore puts back what Synapse or the factory stored in it.' }));
  if (dev.profiles.length > 1) box.append(el('p', { className: 'note', textContent: 'Compare shows every profile side by side.' }));
  return box;
}

// Esc closes the panel (and returns to its tile), or leaves Compare.
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || e.target.classList.contains('combo')) return;
  if (view === 'compare') { view = 'work'; render(); return; }
  if (sel) closePanel();
});

// Open a setting from anywhere (the live preview, a Compare cell): switch profile if needed.
async function toggleEditor(row, name) {
  if (name !== dev.active) {
    const ok = await activate(name, true); if (!ok) return;
  }
  view = 'work';
  section = sectionOf(row) || section;
  sel = null;
  render();
  select(row);
}
function focusCell(row) {
  const t = document.querySelector(`.tile[data-row="${CSS.escape(row)}"]`);
  if (t) t.focus({ preventScroll: true });
}
// Data changed: redraw what shows it, leaving an open editor alone.
function renderSheet() {
  if (!dev || showAll) return;
  if (view === 'compare') renderCompare(); else renderWork(true);
}
// One value changed: update its tile, the rail line, and its Compare cell.
function refreshCell(row) {
  if (view === 'compare') return renderCompare();
  const t = document.querySelector(`.tile[data-row="${CSS.escape(row)}"]`);
  if (t) {
    const [html, changed] = cellView(row, dev.active);
    t.querySelector('.tv').innerHTML = html; t.classList.toggle('changed', !!changed);
  }
  renderRail(sections());
}

// ---------- Compare: every profile side by side ----------

function renderCompare() {
  const t = $('sheet'), names = dev.profiles, secs = sections().filter(s => !['macros', 'profile', 'device'].includes(s.id));
  if (secs.some(s => s.id === 'buttons')) loadButtons(dev);
  t.innerHTML = '';
  const head = el('tr');
  head.append(el('th', { scope: 'col' }, el('span', { className: 'hint', textContent: 'Setting' })));
  names.forEach(n => head.append(profileHeader(n)));
  t.append(el('thead', {}, head));
  const span = names.length + 1;
  secs.forEach(s => {
    const body = el('tbody');
    body.append(el('tr', { className: 'grp' }, el('th', { colSpan: span, scope: 'rowgroup', textContent: s.name + (s.id === 'buttons' && btnLayer === 'hypershift' ? ' · HyperShift' : '') })));
    const rowsOf = s.loading ? [{ key: 'loading', label: 'Reading buttons…' }] : s.rows;
    rowsOf.forEach(r => {
      const tr = el('tr');
      tr.append(el('th', { scope: 'row', textContent: r.label }));
      names.forEach(n => {
        const [html, remapped] = cellView(r.key, n);
        const changed = n === dev.active ? remapped : differs(r.key, n);
        const b = el('button', { className: 'cell' + (changed ? ' changed' : ''), innerHTML: html, disabled: r.key === 'loading',
          ariaLabel: `${r.label} in ${n}` + (n === dev.active ? '' : ' (makes it live)'), onclick: () => toggleEditor(r.key, n) });
        tr.append(el('td', { className: n === dev.active ? 'c-on' : 'c-other' }, b));
      });
      body.append(tr);
    });
    t.append(body);
  });
  requestAnimationFrame(placeBand);
}
$('compareBtn').onclick = () => { view = view === 'compare' ? 'work' : 'compare'; sel = null; render(); };

// Comparable value of a cell, to mark where another profile differs from the active one.
function cellValue(key, name) {
  const p = prof(name), active = name === dev.active;
  if (key.startsWith('zone:')) { const z = zoneOf(p, key.slice(5)); return p.keys && p.keys.length && dev.matrix ? 'keys' : z.off ? 'off' : (z.effect || z.color || '') + '/' + (z.brightness ?? 100); }
  if (key === 'keys') return (p.keys || []).join();
  if (key === 'dpi') return String(active && dev.dpi ? [dev.dpi.x, dev.dpi.y] : p.dpi || '');
  if (key === 'polling') return String(active && dev.polling ? dev.polling.hz : p.polling || '');
  if (key === 'stages') { const st = stagesOf(name); return st ? st.active + ':' + st.list.join(' ') : ''; }
  if (key === 'sleep') { const sl = sleepOf(name); return sl ? sl.auto + ':' + sl.minutes : ''; }
  if (key === 'macros') return 'shared'; // the device's, the same in every profile
  if (key.startsWith('btn:')) {
    const b = (btnData[dev.id] || []).find(x => x.name === key.slice(4)); if (!b) return '';
    const skey = btnLayer === 'normal' ? b.name : b.name + '/hypershift';
    return active ? b[btnLayer] : (p.buttons && p.buttons[skey]) || b.saved[btnLayer] || b[btnLayer];
  }
  return '';
}
const differs = (key, name) => name !== dev.active && cellValue(key, name) !== cellValue(key, dev.active);

// What one cell says: [html, changed?]. Active column: changed = remapped from what the
// mouse saved. Other columns get their mark from differs().
function cellView(key, name) {
  const p = prof(name), active = name === dev.active;
  if (key.startsWith('zone:')) {
    const z = zoneOf(p, key.slice(5));
    if (p.keys && p.keys.length && dev.matrix) return ['<span class="unset">Per-key colors</span>'];
    if (z.off) return ['<span class="sw off"></span>Off'];
    if (z.effect) return [esc(effectLabel(z.effect))];
    if (!z.color) return ['<span class="unset">Not set</span>'];
    return [`<span class="sw" style="background:#${esc(z.color)}"></span><span class="num">#${esc(z.color)}</span>` +
      (z.brightness != null && z.brightness !== 100 ? ` <small class="num">${z.brightness}%</small>` : '')];
  }
  if (key === 'keys') {
    if (!p.keys || !p.keys.length) return ['<span class="unset">Whole keyboard</span>'];
    const colors = [...new Set(p.keys.filter(k => k !== '000000'))];
    return [colors.slice(0, 5).map(c => `<span class="sw" style="background:#${esc(c)}"></span>`).join('') + ` <small>${plural(colors.length, 'color')}</small>`];
  }
  if (key === 'dpi') {
    const d = active && dev.dpi ? [dev.dpi.x, dev.dpi.y] : p.dpi;
    if (!d) return ['<span class="unset">Not set</span>'];
    return [`<span class="big num">${d[0] === d[1] ? d[0] : d[0] + ' × ' + d[1]}</span> <small>DPI</small>`];
  }
  if (key === 'polling') {
    const v = active && dev.polling ? dev.polling.hz : p.polling;
    return v ? [`<span class="num">${hz(v)}</span>`] : ['<span class="unset">Not set</span>'];
  }
  if (key === 'stages') {
    const st = stagesOf(name);
    if (!st) return ['<span class="unset">Not set</span>'];
    return [st.list.map((d, i) => { const v = d[0] === d[1] ? d[0] : d[0] + '×' + d[1];
      return i + 1 === st.active ? `<b class="num">${v}</b>` : `<span class="num">${v}</span>`; }).join(' · ')];
  }
  if (key === 'sleep') {
    const sl = sleepOf(name);
    if (!sl) return ['<span class="unset">Not set</span>'];
    return [sl.auto === false ? 'Never' : `After <span class="num">${sl.minutes}</span> min`];
  }
  if (key === 'macros') {
    const m = macroData[dev.id];
    if (!m) return ['<span class="unset">…</span>'];
    return [m.macros.length ? `${plural(m.macros.length, 'macro')} <small>· every profile</small>` : '<span class="unset">None yet</span>'];
  }
  if (key === 'loading') return ['<span class="unset">…</span>'];
  if (key === 'apps') { const a = p.apps || []; return [a.length ? esc(a.join(', ')) : '<span class="unset">No games yet</span>']; }
  if (key === 'device') return [esc(dev.firmware ? 'Firmware ' + dev.firmware : KINDS[dev.kind] || 'Device')];
  if (key.startsWith('btn:')) {
    const b = (btnData[dev.id] || []).find(x => x.name === key.slice(4)); if (!b) return [''];
    const skey = btnLayer === 'normal' ? b.name : b.name + '/hypershift';
    if (active) return [esc(actionLabel(b[btnLayer])), b.remapped[btnLayer]];
    const own = p.buttons && p.buttons[skey];
    return [esc(actionLabel(own || b.saved[btnLayer] || b[btnLayer]))];

  return [''];
}

  const add = el('button', { className: 'addgame', innerHTML: icon('plus') + ((p.apps || []).length ? 'Game' : 'Game or app'),

function colorPicker(current, onPick) {

  PRESETS.forEach(([c, n]) => { const b = el('button', { title: n + ' #' + c, ariaLabel: n, onclick: () => { onPick(c); sync(c); } });
    b.dataset.c = c; b.style.background = '#' + c; presets.append(b); });
  const pick = el('input', { type: 'color', ariaLabel: 'Custom color', value: '#' + (current || '808080').toLowerCase(), oninput: e => { onPick(e.target.value.slice(1).toUpperCase()); hex.value = e.target.value.toUpperCase(); } });
  const hex = el('input', { type: 'text', className: 'hex', maxLength: 7, ariaLabel: 'Hex color', value: current ? '#' + current : '', placeholder: 'Not set',
    onchange: e => { const v = e.target.value.replace('#', '').toUpperCase(); if (/^[0-9A-F]{6}$/.test(v)) { onPick(v); sync(v); } else toast('Use six hex digits, like FF2800', true); } });

  mark(current);

// Built-in effects the device runs by itself. Colors come from the zone's color above.
const EFFECTS = [['static', 'Static color'], ['spectrum', 'Spectrum cycling'], ['wave', 'Wave'],
  ['breathing', 'Breathing'], ['reactive', 'Reactive'], ['starlight', 'Starlight']];
function effectLabel(e) {
  const [kind, rest = ''] = e.split(':'), [arg, n] = rest.split('@');
  const name = (EFFECTS.find(x => x[0] === kind) || [kind, kind])[1];
  if (kind === 'wave') return `${name} ${arg === 'left' ? '←' : '→'}`;
  if (arg && arg !== 'random') return name + ' #' + arg.split(',')[0];
  return arg === 'random' ? name + ' · random' : name;
}
function effectGroup(name) {
  const z = zoneOf(dev.profile, name), cur = z.effect || '';
  const [kind0, rest = ''] = cur.split(':'), [arg0, n0] = rest.split('@');
  const kind = cur ? kind0 : 'static';
  const sel = el('select', { id: 'zoneFx', ariaLabel: 'Effect' });
  EFFECTS.forEach(([v, t]) => sel.append(new Option(t, v, false, v === kind)));
  const dir = el('select', { ariaLabel: 'Wave direction' });
  [['right', 'Right →'], ['left', '← Left']].forEach(([v, t]) => dir.append(new Option(t, v, false, kind === 'wave' && v === (arg0 || 'right'))));
  const speed = el('input', { type: 'range', min: 1, max: 5, step: 1, value: kind === 'wave' ? (n0 || 3) : 3, ariaLabel: 'Wave speed' });
  const dur = el('select', { ariaLabel: 'Duration' });
  [['1', 'Short'], ['2', 'Medium'], ['3', 'Long']].forEach(([v, t]) => dur.append(new Option(t, v, false, v === (n0 || '2'))));
  const rnd = el('input', { type: 'checkbox', id: 'fxRandom', checked: arg0 === 'random' });
  const rndLabel = el('label', { htmlFor: 'fxRandom', textContent: 'Random colors' });
  const show = () => {
    const k = sel.value;
    dir.hidden = speed.hidden = k !== 'wave';
    dur.hidden = !(k === 'reactive' || k === 'starlight');
    rnd.hidden = rndLabel.hidden = !(k === 'breathing' || k === 'starlight');
  };
  const send = async () => {
    show();
    const k = sel.value, color = zoneOf(dev.profile, name).color || '00FF00';
    if (k === 'static') return setColor(color, name);
    const text = k === 'spectrum' ? 'spectrum'
      : k === 'wave' ? `wave:${dir.value}@${speed.value}`
      : k === 'reactive' ? `reactive:${color}@${dur.value}`
      : k === 'breathing' ? `breathing:${rnd.checked ? 'random' : color}`
      : `starlight:${rnd.checked ? 'random' : color}@${dur.value}`;
    try {
      await api('/api/effect', { zone: name, effect: text });
      record(name, { effect: text, off: false });
      toast(effectLabel(text) + ' · saved to ' + dev.active);
    } catch (e) { toast(e.message, true); sel.value = (zoneOf(dev.profile, name).effect || 'static').split(':')[0]; show(); }
  };
  [sel, dir, speed, dur, rnd].forEach(c => c.onchange = send);
  show();
  return el('div', { className: 'edgroup' }, el('h3', { textContent: 'Effect' }),
    el('div', { className: 'row' }, sel, dir, speed, dur, rnd, rndLabel),
    el('p', { className: 'note', textContent: 'Runs on the device itself. Not every device has every effect; it says so if not.' }));
}

// DPI stages of a profile: the active column shows the mouse, following its DPI button.
function stagesOf(name) {
  if (name !== dev.active || !dev.stages) {
    const s = prof(name).dpi_stages;
    return s ? { active: s.active, list: s.stages } : null;
  }
  const list = dev.stages.list;
  const at = dev.dpi ? list.findIndex(d => d[0] === dev.dpi.x && d[1] === dev.dpi.y) : -1;
  return { active: at >= 0 ? at + 1 : dev.stages.active, list };
}

function stagesEditor(box) {
  const d = dev.dpi || { min: 100, max: 30000, step: 50 };
  const st = stagesOf(dev.active), list = st.list.map(v => v.slice());

  const rowsBox = el('div', { className: 'edgroup', id: 'stageRows' });
  const add = el('button', { className: 'ghost', innerHTML: icon('plus') + 'Add stage' });

    rowsBox.innerHTML = '';
    list.forEach((v, i) => {
      const num = el('input', { type: 'number', className: 'dpi num', min: d.min, max: d.max, step: d.step, value: v[0],
        ariaLabel: 'Stage ' + (i + 1) + ' DPI', onchange: e => { const n = Math.round(+e.target.value); if (n) { list[i] = [n, n]; save(); } } });
      const use = el('input', { type: 'radio', name: 'stageUse', checked: i + 1 === active, id: 'stageUse' + i,
        onchange: () => { active = i + 1; save(); } });
      const del = el('button', { className: 'ghost', innerHTML: icon('x'), title: 'Remove stage ' + (i + 1), ariaLabel: 'Remove stage ' + (i + 1),
        disabled: list.length === 1, onclick: () => { list.splice(i, 1); if (active > i + 1 || active > list.length) active = Math.max(1, active - 1); save(); } });

// Asks Razer's public product page whether newer firmware is out. Never installs anything.
const fwResult = {};

    box.innerHTML = '';

        el('a', { href: r.url, target: '_blank', rel: 'noopener noreferrer', textContent: 'Download from Razer' }));
      if (r.guide && r.guide !== r.url) box.append(' · ', el('a', { href: r.guide, target: '_blank', rel: 'noopener noreferrer', textContent: 'Install guide' }));
    } else box.append(r.state === 'current' ? 'Firmware is up to date' : 'Razer lists no firmware updates for it');
  };
  if (fwResult[dev.id]) show(fwResult[dev.id]);
  else box.append(el('button', { className: 'link', textContent: 'Check for firmware update',
    title: 'Asks apps.razer.com, the page Synapse uses. Nothing is installed.',
    onclick: async e => {
      e.target.disabled = true; e.target.textContent = 'Checking…';
      try { fwResult[dev.id] = await api('/api/firmware', {}); show(fwResult[dev.id]); }
      catch (err) { toast(err.message, true); e.target.disabled = false; e.target.textContent = 'Check for firmware update'; }

// ---------- Buttons ----------
// Values are action texts, as in `secbird button`.
const BTN_CHOICES = [
  ['Mouse', [['left', 'Left click'], ['right', 'Right click'], ['middle', 'Middle click'], ['back', 'Back'],
    ['forward', 'Forward'], ['double-click', 'Double click'], ['scroll-up', 'Scroll up'], ['scroll-down', 'Scroll down'],
    ['scroll-left', 'Scroll left'], ['scroll-right', 'Scroll right']]],
  ['Keyboard', [['key', 'Key or shortcut…'], ['turbo-key', 'Turbo key…']]],
  ['Turbo', [['turbo-left', 'Turbo left click'], ['turbo-right', 'Turbo right click']]],
  ['Sensitivity', [['dpi-up', 'DPI up'], ['dpi-down', 'DPI down'], ['dpi-cycle-up', 'DPI cycle'],
    ['dpi-cycle-down', 'DPI cycle down'], ['dpi-clutch', 'Sniper (DPI while held)…']]],
  ['Media', [['media:volume-up', 'Volume up'], ['media:volume-down', 'Volume down'], ['media:mute', 'Mute'],
    ['media:play-pause', 'Play / pause'], ['media:next-track', 'Next track'], ['media:previous-track', 'Previous track']]],
  ['Macro', [['macro', 'Play a macro…']]],
  ['Other', [['hypershift', 'HyperShift (hold)'], ['profile-cycle-up', 'Next on-board profile'],
    ['scroll-mode:1', 'Switch wheel free-spin'], ['disabled', 'Disabled']]],
];
const CHOICE_LABEL = Object.fromEntries(BTN_CHOICES.flatMap(g => g[1]));
const KEY_CODES = { Enter: 'enter', Escape: 'esc', Backspace: 'backspace', Tab: 'tab', Space: 'space', Minus: 'minus',
  Equal: 'equal', BracketLeft: 'lbracket', BracketRight: 'rbracket', Backslash: 'backslash', Semicolon: 'semicolon',
  Quote: 'quote', Backquote: 'grave', Comma: 'comma', Period: 'period', Slash: 'slash', CapsLock: 'capslock',
  PrintScreen: 'printscreen', ScrollLock: 'scrolllock', Pause: 'pause', Insert: 'insert', Home: 'home', PageUp: 'pageup',
  Delete: 'delete', End: 'end', PageDown: 'pagedown', ArrowRight: 'right', ArrowLeft: 'left', ArrowDown: 'down', ArrowUp: 'up' };
const MOD_CODES = { ControlLeft: 'ctrl', ShiftLeft: 'shift', AltLeft: 'alt', MetaLeft: 'win',
  ControlRight: 'rctrl', ShiftRight: 'rshift', AltRight: 'ralt', MetaRight: 'rwin' };
const keyName = code => KEY_CODES[code] || (/^Key[A-Z]$/.test(code) && code.slice(3).toLowerCase())

// Action text -> [choice, combo, number] for the controls, and back.
function splitAction(a) {
  let m;
  if ((m = /^turbo:key:(.+)@(\d+)$/.exec(a))) return ['turbo-key', m[1], m[2]];
  if ((m = /^turbo:(left|right)@(\d+)$/.exec(a))) return ['turbo-' + m[1], '', m[2]];
  if ((m = /^key:(.+)$/.exec(a))) return ['key', m[1], ''];
  if ((m = /^dpi-clutch:(\d+)/.exec(a))) return ['dpi-clutch', '', m[1]];

}

  if (choice === 'turbo-key') return keys ? `turbo:key:${keys}@${n || 7}` : null;
  if (choice === 'turbo-left' || choice === 'turbo-right') return `turbo:${choice.slice(6)}@${n || 7}`;
  if (choice === 'dpi-clutch') return 'dpi-clutch:' + (n || 400);
  if (choice === 'macro') return keys ? 'macro:' + keys + (n && n !== '1' ? '@' + n : '') : null;
  return choice;
}
// Plain words for any action text.
function actionLabel(a) {
  if (!a) return '';

  if ((m = /^key:(.+)$/.exec(a))) return 'Key ' + combo(m[1]);
  if ((m = /^turbo:key:(.+)@(\d+)$/.exec(a))) return `Turbo key ${combo(m[1])} · ${m[2]}/s`;
  if ((m = /^turbo:(.+)@(\d+)$/.exec(a))) return `Turbo ${(CHOICE_LABEL[m[1]] || m[1].replace(/-/g, ' ')).toLowerCase()} · ${m[2]}/s`;
  if ((m = /^dpi-clutch:(\d+)/.exec(a))) return `Sniper · ${m[1]} DPI`;
  if ((m = /^macro:(\d+)(?:@(\w+))?$/.exec(a))) {

    const how = { hold: ' · while held', toggle: ' · toggle' }[m[2]] || (m[2] && m[2] !== '1' ? ` · ${m[2]}×` : '');
    return 'Macro ' + (mac ? `“${mac.name}”` : '#' + m[1]) + how;

}

function buttonEditor(box, name) {

    sel.append(g);
  });

    const play = playSel.value === 'times' ? String(Math.max(2, Math.min(255, +numIn.value || 2))) : playSel.value;
    return [macroSel.value, play];
  };
  const send = () => {
    const a = sel.value === 'macro' ? joinAction('macro', ...macroArgs()) : joinAction(sel.value, keyIn.dataset.keys, numIn.value);
    if (a) assign(b.name, a);

function macrosEditor(box) {
  const data = macroData[dev.id];

  const list = el('div', { className: 'edgroup' }, el('h3', { textContent: 'On this device' }));

    el('code', { textContent: mc.steps || mc.error || '' }))));

  const gap = () => { const now = performance.now(); if (last && now - last >= 10) out.push('wait:' + Math.round(now - last)); last = now; };
  const BTN = ['left', 'middle', 'right', 'back', 'forward'];

    el('div', { className: 'row' }, rec, save)),
    el('p', { className: 'note', textContent: 'Steps: tap:<key or ctrl+c>, down:<key>, up:<key>, wait:<ms>, click:<left|right|middle|back|forward>, press:/release:<button>, wheel:up|down. Then pick it for a button in Buttons.' }));

// ---------- Lighting, DPI, keys: send and record ----------

function record(name, patch) {
  dev.profile.lighting = dev.profile.lighting || {};
  dev.profile.lighting[name] = { ...zoneOf(dev.profile, name), ...patch };
  if (dev.matrix && (patch.color || patch.off)) dev.profile.keys = [];
  paintPreview(); refreshCell('zone:' + name); if (dev.matrix) { refreshCell('keys'); paintKeys(); }
}
const sendColor = {};
function setColor(hex, name) {
  record(name, { color: hex, off: false, effect: undefined });
  const fx = $('zoneFx'); if (fx) fx.value = 'static';
  const on = $('zoneOn'); if (on) on.checked = true;
  const br = $('zoneBright'), bv = $('zoneBrightVal');
  if (br && br.disabled) { br.disabled = false; bv.textContent = (zoneOf(dev.profile, name).brightness ?? 100) + '%'; }
  (sendColor[name] ||= live(c => api('/api/color', { zone: name, color: c })))(hex);
}
const sendBright = live(([name, value]) => api('/api/brightness', { zone: name, value }));
const sendDpi = live(v => api('/api/dpi', { x: v, y: v }).then(r => { dev.dpi.x = dev.dpi.y = r.dpi[0]; dev.profile.dpi = r.dpi; refreshCell('dpi'); }));
function setDpi(v) {
  v = Math.round(Number(v)); if (!v) return;

  if (n) n.value = v; if (s) s.value = v;

  sendDpi(v);

// Colors on the keys: painted keys, else the whole-keyboard color, else off.
function frame() {
  const keys = dev.profile.keys;
  if (keys && keys.length === keyCount()) return keys;
  const z = dev.leds[0] ? zoneOf(dev.profile, dev.leds[0].name) : {};
  return Array(keyCount()).fill(!z.off && z.color ? z.color : '000000');
}
function renderKb(svg) {
  const keys = layout(dev.matrix), cols = dev.matrix.cols;
  const w = Math.max(...keys.map(k => k.x + k.w)), h = Math.max(...keys.map(k => k.y + k.h));
  svg.setAttribute('viewBox', `-0.05 -0.05 ${w + 0.1} ${h + 0.1}`);
  svg.innerHTML = keys.map(k =>
    `<g data-i="${k.row * cols + k.col}"><rect x="${k.x + .05}" y="${k.y + .05}" width="${k.w - .1}" height="${k.h - .1}" rx=".12"/>` +
    `<text x="${k.x + k.w / 2}" y="${k.y + k.h / 2}">${esc(k.label)}</text></g>`).join('');
  svg.onpointerdown = e => { painting = true; paintAt(e.target); e.preventDefault(); };

  const f = frame();
  svg.querySelectorAll('g').forEach(g => {
    const c = f[g.dataset.i] || '000000', n = parseInt(c, 16);
    const lum = 0.3 * (n >> 16) + 0.59 * (n >> 8 & 255) + 0.11 * (n & 255);

const sendKeys = live(keys => api('/api/keys', { keys }));
function setKeys(keys) {
  dev.profile.keys = keys;

window.addEventListener('pointerup', () => painting = false);

// ---------- Profiles ----------

async function activate(name, quiet) {
  try {
    const r = await api('/api/profile', { action: 'use', name });
    adopt(r.device);
    if (dev.kind === 'mouse') btnData[dev.id] = undefined; // the new profile's remaps; read again when shown
    if (!quiet) sel = null;
    render();
    toast(r.failures.length ? 'Some settings failed: ' + r.failures.join('; ') : (quiet ? 'Switched to ' + name + ' to edit it' : name + ' is active'), r.failures.length > 0);
    return true;
  } catch (err) { toast(err.message, true); render(); return false; }
}
async function createProfile(name) {
  try {
    await api('/api/profile', { action: 'new', name });
    await activate(name, true);
    toast('Created ' + name + ' (a copy of the previous profile)');
  } catch (err) { toast(err.message, true); }
}
async function deleteProfile(name) {
  const other = name === dev.active ? dev.profiles.find(p => p !== name) : null;
  if (!confirm(`Delete the profile "${name}"?` + (other ? ` "${other}" becomes active.` : ' Games tied to it go back to the active profile.'))) return;
  try {
    if (other) await api('/api/profile', { action: 'use', name: other });
    const r = await api('/api/profile', { action: 'delete', name }); adopt(r.device);
    if (other && dev.kind === 'mouse') btnData[dev.id] = undefined;
    sel = null; render(); toast('Deleted ' + name);
  } catch (err) { toast(err.message, true); }
}
async function saveApps(name, apps, msg) {
  try {
    const r = await api('/api/profile', { action: 'apps', name, apps });
    adopt(r.device);
    // The response carries every profile, so a game that moved between profiles shows everywhere.
    render(); toast(msg);

}

// Follow DPI changes made with the mouse's own DPI button. The tray answers from memory

let liveSeq = null;
async function pollLive() {
  if (document.hidden) return;
  try {
    const r = await api('/api/live');
    if (liveSeq !== null && r.seq !== liveSeq) {
      for (const d of devices) {
        const v = r.dpi[d.id];
        if (v && d.dpi && (d.dpi.x !== v[0] || d.dpi.y !== v[1])) {
          d.dpi.x = v[0]; d.dpi.y = v[1];
          if (d.profile) d.profile.dpi = [v[0], v[1]];
          if (showAll) renderOverview(); else if (dev && d.id === dev.id) showDpi();
        }
      }
    }
    liveSeq = r.seq;
  } catch { /* the tray may be busy; try again next tick */ }
}
setInterval(pollLive, 1000);

async function load(path = '/api/state', body) {
  try {
    const s = body ? await api(path, body) : await api(path);
    devices = s.devices; unsupported = s.unsupported || []; synapse = s.synapse || [];
    devices.forEach(d => { d.profile = d.profile || {}; d.profilesData = d.profilesData || {}; d.profilesData[d.active] = d.profile; });
    if (s.version) $('home').title = 'Secretarybird ' + s.version + ': all devices';
    const want = new URLSearchParams(location.search).get('d');
    const wanted = d => d.pid === want || d.id === want;
    dev = devices.find(d => dev && d.id === dev.id) || devices.find(wanted) || devices[0] || null;
    if (showAll === null) showAll = !devices.some(wanted) && (devices.length > 1 || unsupported.length > 0);
    if (!dev) sel = null;
    render();
  } catch (e) { toast(e.message, true); }
}
// Sync: one color on every zone of every device. Dragging the swatch syncs live.
const sendSync = live(async color => {
  const r = await api('/api/sync', { color });
  devices = r.state.devices; unsupported = r.state.unsupported || []; synapse = r.state.synapse || [];
  devices.forEach(d => { d.profile = d.profile || {}; d.profilesData = d.profilesData || {}; d.profilesData[d.active] = d.profile; });
  dev = devices.find(d => d.id === dev.id) || devices[0];
  render();
  if (r.failed.length) throw new Error('Some zones failed: ' + r.failed.join('; '));
  return r;
}, r => '#' + $('syncColor').value.slice(1).toUpperCase() + ' on ' + plural(r.zones, 'zone') + ' across ' + plural(r.devices, 'device'));
// Theme: Auto follows Windows; a picked theme is remembered in this browser. Older builds
// stored 'dark' or 'light' from a light/dark toggle: 'dark' now means the default (Auto).
const themeKey = 'secbird-theme';
const THEMES = ['bridge', 'roast', 'classic', 'light', 'workshop', 'neon'];
function setTheme(t) {
  const root = document.documentElement;
  if (THEMES.includes(t)) root.dataset.theme = t; else delete root.dataset.theme;
  $('theme').value = root.dataset.theme || '';
  requestAnimationFrame(() => { placeUnderline(); placeBand(); });
}
try { const t = localStorage.getItem(themeKey); setTheme(t === 'dark' ? '' : t); } catch (e) { }
$('theme').onchange = e => {
  setTheme(e.target.value);
  try { if (e.target.value) localStorage.setItem(themeKey, e.target.value); else localStorage.removeItem(themeKey); } catch (err) { }
};
$('home').onclick = () => { if (devices.length || unsupported.length) { showAll = true; sel = null; render(); } };
$('syncColor').oninput = e => { syncPicked = true; sendSync(e.target.value.slice(1).toUpperCase()); };
$('syncBtn').onclick = () => sendSync($('syncColor').value.slice(1).toUpperCase());
const updateTabsRow = scrollRow($('tabsRow')), updateProfilesRow = scrollRow($('profilesRow'));
// Narrow windows lay the sections out as a row: the wheel scrolls it and a fade shows there is more.
(() => {
  const rail = $('rail');
  const update = () => rail.classList.toggle('more-r', rail.scrollWidth - rail.clientWidth > 1 && rail.scrollLeft + rail.clientWidth < rail.scrollWidth - 1);
  rail.addEventListener('scroll', update, { passive: true });
  rail.addEventListener('wheel', e => {
    if (getComputedStyle(rail).flexDirection !== 'row' || rail.scrollWidth <= rail.clientWidth) return;
    rail.scrollLeft += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; e.preventDefault();
  }, { passive: false });
  new ResizeObserver(update).observe(rail);
  new MutationObserver(update).observe(rail, { childList: true });
})();
$('rescan').onclick = () => { btnData = {}; macroData = {}; load('/api/rescan', {}); };
// Coming back to the window: refresh, but leave an open editor alone.
window.addEventListener('focus', () => { if (!sel) load(); });
load();
</script>
</body>
